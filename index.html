<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deterministic Terrain</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      text-align: center;
    }
    canvas {
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>
<canvas id="map"></canvas>

<script>
// =========================
// CONFIG
// =========================
const WIDTH = 500;
const HEIGHT = 500;
const SCALE = 0.01;
const SEED = 42;

// =========================
// PSEUDO NOISE
// =========================
function pseudoNoise(x, y, seed = 0) {
  const value = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
  return value - Math.floor(value);
}

// =========================
// SMOOTH NOISE
// =========================
function smoothNoise(x, y, seed = 0) {
  const x0 = Math.floor(x);
  const y0 = Math.floor(y);
  const x1 = x0 + 1;
  const y1 = y0 + 1;

  const sx = x - x0;
  const sy = y - y0;

  const n00 = pseudoNoise(x0, y0, seed);
  const n10 = pseudoNoise(x1, y0, seed);
  const n01 = pseudoNoise(x0, y1, seed);
  const n11 = pseudoNoise(x1, y1, seed);

  const ix0 = n00 * (1 - sx) + n10 * sx;
  const ix1 = n01 * (1 - sx) + n11 * sx;

  return ix0 * (1 - sy) + ix1 * sy;
}

// =========================
// FRACTAL NOISE
// =========================
function fractalNoise(x, y, seed = 0, octaves = 5) {
  let value = 0;
  let amplitude = 1;
  let frequency = 1;
  let maxValue = 0;

  for (let i = 0; i < octaves; i++) {
    value += smoothNoise(x * frequency, y * frequency, seed + i) * amplitude;
    maxValue += amplitude;

    amplitude *= 0.5;
    frequency *= 2;
  }

  return value / maxValue;
}

// =========================
// TERRAIN FUNCTION
// =========================
function terrain(x, y) {
  const base = fractalNoise(x * SCALE, y * SCALE, SEED);

  // Shape terrain
  return Math.pow(base, 1.5);
}

// =========================
// COLOR MAPPING
// =========================
function getColor(h) {
  if (h < 0.3) return [0, 0, 150];        // deep water
  if (h < 0.4) return [0, 100, 255];      // shallow water
  if (h < 0.45) return [240, 230, 140];   // sand
  if (h < 0.6) return [50, 180, 50];      // grass
  if (h < 0.75) return [100, 100, 100];   // rock
  return [255, 255, 255];                 // snow
}

// =========================
// RENDER
// =========================
const canvas = document.getElementById("map");
canvas.width = WIDTH;
canvas.height = HEIGHT;

const ctx = canvas.getContext("2d");
const imageData = ctx.createImageData(WIDTH, HEIGHT);

for (let y = 0; y < HEIGHT; y++) {
  for (let x = 0; x < WIDTH; x++) {

    const h = terrain(x, y);
    const [r, g, b] = getColor(h);

    const index = (y * WIDTH + x) * 4;
    imageData.data[index] = r;
    imageData.data[index + 1] = g;
    imageData.data[index + 2] = b;
    imageData.data[index + 3] = 255;
  }
}

ctx.putImageData(imageData, 0, 0);

</script>
</body>
</html>
